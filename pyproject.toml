[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gandharva"
dynamic = ["version"]
description = "语音与音乐交叉的歌声合成（SVS）与转换（SVC）框架，纯 NumPy/SciPy 实现"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Rong Shengxue" }]
dependencies = [
    "numpy>=1.23",
    "scipy>=1.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.16.4",
    "mypy>=1.8",
]

[project.scripts]
gandharva = "gandharva.cli:main"

[project.urls]
Homepage = "https://github.com/abenneto/gandharva"
Issues = "https://github.com/abenneto/gandharva/issues"

[tool.hatch.version]
path = "src/gandharva/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/gandharva"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "NPY"]
ignore = ["E741"]  # 单字母变量在 DSP 公式里可读性更好

[tool.ruff.lint.isort]
known-first-party = ["gandharva"]

[tool.mypy]
python_version = "3.12"
files = ["src/gandharva"]
strict = true
warn_unused_ignores = true
warn_redundant_casts = true

[[tool.mypy.overrides]]
module = ["scipy.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"

[tool.coverage.run]
branch = true
source = ["gandharva"]

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
